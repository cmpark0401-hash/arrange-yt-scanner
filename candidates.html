<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#a855f7">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <title>🔄 분석 업데이트</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
:root {
  /* 다크 베이스 */
  --bg:#0a0a12; --surface:#13131c; --surface2:#1a1a26;
  --border:#26263a; --divider:#1f1f30; --hover:#1e1e2e;
  /* 텍스트 */
  --text:#ededf2; --text2:#9696a6; --text3:#6c6c80;
  /* 키 컬러 — 보라 (알고리즘 해킹) */
  --primary:#a855f7; --primary-hi:#c084fc; --primary-bg:rgba(168,85,247,.12); --primary-bd:rgba(168,85,247,.35);
  /* 보조 강조 */
  --hot:#84cc16;        /* 라임 — 폭발/검증 */
  --hot-bg:rgba(132,204,22,.10); --hot-bd:rgba(132,204,22,.35);
  --warn:#ff7a45;       /* 오렌지 — 시그널 */
  --warn-bg:rgba(255,122,69,.10); --warn-bd:rgba(255,122,69,.35);
  --danger:#ef4444;     /* 빨강 — 폭락 */
  --danger-bg:rgba(239,68,68,.10); --danger-bd:rgba(239,68,68,.35);
  --up:#4ade80; --down:#ef4444;  /* 등락 */
  --info:#60a5fa; --info-bg:rgba(96,165,250,.10);
  /* 호환 (구 변수명) */
  --blue:var(--primary); --green:var(--up); --red:var(--danger); --purple:var(--primary-hi);
  --chip:rgba(168,85,247,.13);
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Inter','Noto Sans KR',-apple-system,sans-serif;
  line-height:1.5; color:var(--text); background:var(--bg);
  max-width:1320px; margin:0 auto; padding:18px 20px 48px;
  -webkit-font-smoothing:antialiased; font-feature-settings:'cv11','ss01';
}
header { padding:14px 0 16px; border-bottom:1px solid var(--divider); margin-bottom:20px;
         display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
header .brand-block { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
header h1 { font-size:13px; font-weight:400; color:var(--text2); line-height:1.3; letter-spacing:0; display:flex; align-items:baseline; gap:8px; }
header h1 .brand-flag { font-size:18px; line-height:1; }
header h1 .brand-accent { color:var(--primary); font-weight:800; font-size:22px; letter-spacing:-0.5px; transition:color .15s; }
header .brand-link:hover h1 .brand-accent { color:var(--primary-hi); }
header .brand-link:hover h1 .brand-slogan { color:var(--text); }
header h1 .brand-divider { color:var(--text3); margin:0 2px; }
header h1 .brand-slogan { font-size:13px; color:var(--text2); font-weight:400; }
header .sub { color:var(--text3); font-size:12px; margin-top:4px; flex-basis:100%; }
header .header-chips { display:flex; flex-direction:column; gap:6px; margin-left:auto; align-items:flex-end; }
header .header-chips-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
.h-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:13px;
          background:var(--surface); border:1px solid var(--border); font-size:12px; color:var(--text2); font-weight:500; }
.h-chip b { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
.h-chip.warn { border-color:var(--warn-bd); background:var(--warn-bg); color:var(--warn); }
.h-chip.warn b { color:var(--warn); }
.h-chip.hot { border-color:var(--hot-bd); background:var(--hot-bg); color:var(--hot); }
.h-chip.hot b { color:var(--hot); }
.h-chip.info { border-color:var(--primary-bd); background:var(--primary-bg); color:var(--primary-hi); }
.h-chip.info b { color:var(--primary-hi); }
.h-chip.jp { background:linear-gradient(135deg,#fff 0%,#fff5f5 100%); border:1.5px solid #ff4d4f; color:#0a0a12; font-weight:800; cursor:pointer; transition:all .15s; box-shadow:0 1px 3px rgba(255,77,79,.18); }
.h-chip.jp:hover { background:linear-gradient(135deg,#fff5f5 0%,#ffe0e0 100%); border-color:#e63030; text-decoration:none; transform:translateY(-1px); box-shadow:0 2px 6px rgba(255,77,79,.28); }
.h-chip.white { background:#fff; border-color:#fff; color:#0a0a12; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; }
.h-chip.white:hover { background:#e8e8f0; border-color:#e8e8f0; color:#000; text-decoration:none; }
.h-chip.pulse { background:rgba(34,197,94,.13); border-color:rgba(34,197,94,.55); color:#22c55e; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; }
.h-chip.pulse b { color:#22c55e; }
.h-chip.pulse:hover { background:rgba(34,197,94,.22); border-color:#22c55e; transform:translateY(-1px); text-decoration:none; }
.h-chip.ytg { background:linear-gradient(135deg,rgba(245,158,11,.15) 0%,rgba(251,191,36,.15) 100%); border:1.5px solid rgba(245,158,11,.6); color:#fbbf24; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; }
.h-chip.ytg:hover { background:linear-gradient(135deg,rgba(245,158,11,.25) 0%,rgba(251,191,36,.25) 100%); border-color:#fbbf24; transform:translateY(-1px); text-decoration:none; }
.h-chip.workboard { background:linear-gradient(135deg,rgba(168,85,247,.18) 0%,rgba(217,70,239,.15) 100%); border:1.5px solid rgba(168,85,247,.65); color:#c084fc; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; position:relative; }
.h-chip.workboard:hover { background:linear-gradient(135deg,rgba(168,85,247,.28) 0%,rgba(217,70,239,.25) 100%); border-color:#c084fc; transform:translateY(-1px); text-decoration:none; }
.h-chip.clicklab { background:linear-gradient(135deg,rgba(236,72,153,.18) 0%,rgba(244,114,182,.15) 100%); border:1.5px solid rgba(236,72,153,.65); color:#f472b6; font-weight:700; cursor:pointer; transition:all .15s; text-decoration:none; position:relative; }
.h-chip.clicklab:hover { background:linear-gradient(135deg,rgba(236,72,153,.28) 0%,rgba(244,114,182,.25) 100%); border-color:#f472b6; transform:translateY(-1px); text-decoration:none; }
.chip-date-badge { position:absolute; top:-7px; right:-8px; background:#ef4444; color:#fff; font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:9px; line-height:1.2; letter-spacing:.2px; box-shadow:0 1px 4px rgba(239,68,68,.45); border:1.5px solid rgba(0,0,0,.7); white-space:nowrap; min-width:14px; text-align:center; pointer-events:none; }
.chip-date-badge.pulse { animation:badgePulse 1.8s ease-in-out infinite; }
@keyframes badgePulse { 0%,100% { transform:scale(1); box-shadow:0 1px 4px rgba(239,68,68,.45); } 50% { transform:scale(1.08); box-shadow:0 2px 8px rgba(239,68,68,.7); } }
.h-chip.secondary { background:transparent; border-color:var(--border); color:var(--text2); font-weight:600; cursor:pointer; transition:all .15s; text-decoration:none; }
.h-chip.secondary:hover { background:var(--surface); border-color:var(--primary-bd); color:var(--text); text-decoration:none; }
a.h-chip.warn, a.h-chip.hot, a.h-chip.info { cursor:pointer; transition:all .15s; text-decoration:none; }
a.h-chip.warn:hover, a.h-chip.hot:hover, a.h-chip.info:hover { transform:translateY(-1px); text-decoration:none; filter:brightness(1.1); }
/* chip/nav hover 툴팁 — 아래로 표시 (모든 [data-tip] 요소 공통) */
header, header .header-chips, header .header-chips-row, .nav-links { overflow:visible !important; }
[data-tip] { position:relative; }
[data-tip]:hover { z-index:9999; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%);
  background:#0a0a12; color:#fff; padding:7px 11px; border-radius:7px;
  font-size:11px; font-weight:600; white-space:nowrap; letter-spacing:.2px;
  border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 18px rgba(0,0,0,.65);
  z-index:9999; pointer-events:none;
  animation:tipFade .15s ease-out;
}
[data-tip]:hover::before {
  content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  margin-top:4px; border:6px solid transparent; border-bottom-color:#0a0a12;
  z-index:9999; pointer-events:none;
  animation:tipFade .15s ease-out;
}
@keyframes tipFade { from { opacity:0; transform:translateX(-50%) translateY(-3px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
a { color:var(--primary-hi); text-decoration:none; transition:color .15s; }
a:hover { color:var(--primary); text-decoration:none; }

/* 요약 카드 */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; transition:transform .15s, border-color .15s; }
.card:hover { transform:translateY(-1px); border-color:var(--primary-bd); }
.card .label { font-size:12px; color:var(--text2); margin-bottom:8px; font-weight:600; display:flex; align-items:center; gap:5px; text-transform:none; letter-spacing:0; }
.card .value { font-size:30px; font-weight:800; letter-spacing:-0.6px; line-height:1.05; font-variant-numeric:tabular-nums; }
.card.tone-red { background:var(--danger-bg); border-color:var(--danger-bd); }
.card.tone-red .value { color:var(--danger); }
.card.tone-green { background:var(--hot-bg); border-color:var(--hot-bd); }
.card.tone-green .value { color:var(--hot); }
.card.tone-blue { background:var(--primary-bg); border-color:var(--primary-bd); }
.card.tone-blue .value { color:var(--primary-hi); }
.card.tone-purple { background:rgba(168,85,247,.18); border-color:rgba(168,85,247,.4); }
.card.tone-purple .value { color:var(--primary-hi); }
.card.tone-warn { background:var(--warn-bg); border-color:var(--warn-bd); }
.card.tone-warn .value { color:var(--warn); }

/* 카테고리 탭 */
.tabs { display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 14px; }
.tab { padding:6px 13px; border-radius:16px; background:var(--surface); color:var(--text2);
       font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); transition:all .15s; }
.tab:hover { border-color:var(--primary-bd); color:var(--text); }
.tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.tab .cnt { font-size:11px; opacity:.85; margin-left:5px; padding:1px 6px; background:rgba(255,255,255,.15); border-radius:8px; }

/* 필터 바 */
.filters { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:18px;
           padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; }
.filter-group { display:flex; gap:5px; align-items:center; }
.filter-group .lbl { font-size:11px; color:var(--text2); margin-right:5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.seg { display:flex; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--bg); }
.seg button { padding:6px 12px; border:none; background:transparent; font-size:13px; cursor:pointer; color:var(--text2); font-weight:500; transition:all .15s; }
.seg button:hover { color:var(--text); background:var(--hover); }
.seg button.active { background:var(--primary); color:#fff; }
.toggle { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text); cursor:pointer; }
.toggle input[type=checkbox] { appearance:none; width:32px; height:18px; background:var(--border); border-radius:9px; position:relative; cursor:pointer; transition:background .2s; }
.toggle input[type=checkbox]::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#fff; border-radius:50%; transition:transform .2s; }
.toggle input[type=checkbox]:checked { background:var(--primary); }
.toggle input[type=checkbox]:checked::after { transform:translateX(14px); }
#search { flex:1; min-width:160px; padding:8px 14px; border:1px solid var(--border);
          border-radius:18px; font-size:13px; background:var(--bg); color:var(--text); }
#search::placeholder { color:var(--text3); }
#search:focus { outline:none; border-color:var(--primary); background:var(--surface); }

/* 채널 카드 그리드 */
.ch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
.ch-card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
           padding:18px; transition:all .18s; position:relative; }
.ch-card:hover { border-color:var(--primary-bd); transform:translateY(-2px); box-shadow:0 8px 24px rgba(168,85,247,.12); }
.ch-card.rank-1 { border-color:rgba(255,193,7,.55); background:linear-gradient(180deg, rgba(255,193,7,.06) 0%, var(--surface) 60%); }
.ch-card.rank-2 { border-color:rgba(196,196,196,.45); background:linear-gradient(180deg, rgba(196,196,196,.05) 0%, var(--surface) 60%); }
.ch-card.rank-3 { border-color:rgba(205,127,50,.45); background:linear-gradient(180deg, rgba(205,127,50,.05) 0%, var(--surface) 60%); }
.ch-rank-badge { position:absolute; top:-9px; left:16px; padding:2px 9px; border-radius:10px;
                 background:var(--surface2); border:1px solid var(--border); font-size:11px; font-weight:700; color:var(--text2); font-variant-numeric:tabular-nums; }
.ch-rank-badge.rank-1 { background:linear-gradient(135deg,#ffd700,#ffb300); color:#000; border-color:#ffd700; }
.ch-rank-badge.rank-2 { background:linear-gradient(135deg,#e0e0e0,#a8a8a8); color:#000; border-color:#c0c0c0; }
.ch-rank-badge.rank-3 { background:linear-gradient(135deg,#cd7f32,#8b4513); color:#fff; border-color:#cd7f32; }
.ch-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
.ch-name { font-size:16px; font-weight:700; line-height:1.3; flex:1; min-width:0; color:var(--text); }
.ch-name .delta { font-size:11px; margin-left:6px; vertical-align:middle; font-weight:700; }
.ch-name .delta.up { color:var(--up); }
.ch-name .delta.down { color:var(--down); }
.ch-name .delta.flat { color:var(--text3); }
.ch-meta { font-size:12px; color:var(--text2); margin-top:3px; font-weight:500; }
.ch-type { font-size:10px; padding:2px 8px; border-radius:8px; background:var(--bg); color:var(--text2); white-space:nowrap; font-weight:700; border:1px solid var(--border); text-transform:uppercase; letter-spacing:.3px; }
.ch-cats { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
.ch-cat { font-size:11px; padding:2px 9px; border-radius:9px; background:var(--primary-bg); color:var(--primary-hi); font-weight:600; border:1px solid var(--primary-bd); }
.ch-stats { display:flex; gap:14px; margin:12px 0; padding:10px 0; border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); }
.ch-stat { font-size:11px; color:var(--text2); flex:1; min-width:0; font-weight:500; }
.ch-stat b { font-size:18px; color:var(--text); font-weight:800; display:block; font-variant-numeric:tabular-nums; line-height:1.1; margin-bottom:2px; letter-spacing:-0.3px; }
.ch-stat.sig b { color:var(--danger); }
.ch-stat.hot b { color:var(--hot); }
.ch-vid { margin-top:10px; font-size:12px; }
.ch-vid .vlabel { font-size:10px; color:var(--text2); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.ch-vid .vlabel.popular { color:var(--warn); }
.ch-vid .vlabel.latest { color:var(--hot); }
.ch-vid .vtitle { font-size:13px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:4px; color:var(--text); line-height:1.4; }
.ch-vid .vmeta { font-size:11px; color:var(--text3); margin-top:3px; }
.ch-vid-dual { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--divider); }
.ch-vid-col { min-width:0; }
.ch-thumb-mini { width:100%; aspect-ratio:16/9; background:var(--bg); border-radius:6px; overflow:hidden; margin-bottom:6px; border:1px solid var(--border); position:relative; }
.ch-thumb-mini img { width:100%; height:100%; object-fit:cover; display:block; }
.ch-thumb-mini .views-badge { position:absolute; bottom:4px; right:4px; font-size:10px; padding:1px 5px; border-radius:4px; background:rgba(0,0,0,.78); color:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
/* 스파크라인 (7일 추세) */
.ch-spark { margin-top:6px; padding-top:6px; border-top:1px dashed var(--divider); display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--text2); }
.ch-spark canvas { flex:1; height:24px !important; max-width:140px; }
.ch-spark .spark-val { font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
.ch-freq { font-size:11px; color:var(--text2); display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:8px; background:var(--bg); border:1px solid var(--border); white-space:nowrap; font-weight:600; }
.empty { text-align:center; color:var(--text2); padding:40px; grid-column:1/-1; }

section { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:18px; }
section h2 { font-size:18px; font-weight:700; margin-bottom:14px; letter-spacing:-0.3px; }
.archive-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.archive-grid a { display:block; background:var(--surface); border:1px solid var(--border); padding:11px;
                  border-radius:8px; text-align:center; font-size:13px; color:var(--text); font-weight:600; transition:all .15s; }
.archive-grid a:hover { background:var(--hover); border-color:var(--primary); color:var(--primary-hi); }
.archive-grid a.today { background:var(--primary); border-color:var(--primary); color:#fff; }
.nav-links { margin:14px 0; display:flex; gap:7px; flex-wrap:wrap; }
.nav-links a { background:var(--surface); padding:8px 15px; border-radius:18px; font-size:13px; font-weight:600; color:var(--text2); border:1px solid var(--border); transition:all .15s; }
.nav-links a:hover { border-color:var(--primary-bd); color:var(--text); }
.country-switch { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border:1px solid var(--border);
  border-radius:18px; font-size:13px; font-weight:700; color:var(--text); background:var(--surface); transition:all .15s; }
.country-switch:hover { background:var(--hover); border-color:var(--primary); color:var(--primary-hi); }
.shell-head { position:sticky; top:0; z-index:50; background:var(--bg); padding-top:6px; border-bottom:1px solid var(--divider); backdrop-filter:blur(8px); }
.nav-links a.tab-on { background:var(--primary); color:#fff; border-color:var(--primary); }
#view { min-height:60vh; }
.view-loading { padding:60px 20px; text-align:center; color:var(--text2); font-size:14px; }
.info-bar { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 16px; margin:8px 0 18px; font-size:12px; color:var(--text2); line-height:1.8; }
.info-bar .desc { display:block; margin-bottom:6px; color:var(--text); font-weight:600; font-size:13px; }
.info-bar b { color:var(--text); font-weight:700; }
.legend-item { display:inline-block; margin-right:14px; white-space:nowrap; font-size:12px; }
.nav-links a.nav-primary { background:rgba(168,85,247,.10); color:var(--primary-hi); border:2px solid var(--primary); font-weight:700; padding:7px 14px; }
.nav-links a.nav-primary:hover { background:rgba(168,85,247,.18); color:var(--primary-hi); border-color:var(--primary-hi); }
.nav-links a.nav-primary.tab-on { background:var(--primary); color:#fff; border-color:var(--primary); }
/* 새 메시지 알림 스타일 배지 */
.nav-links a { position:relative; }
.nav-badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; vertical-align:middle; }
.nav-badge.fresh { background:var(--danger); box-shadow:0 0 0 0 rgba(239,68,68,.7); animation:nav-pulse 2s infinite; }
@keyframes nav-pulse {
  0% { box-shadow:0 0 0 0 rgba(239,68,68,.7); }
  70% { box-shadow:0 0 0 8px rgba(239,68,68,0); }
  100% { box-shadow:0 0 0 0 rgba(239,68,68,0); }
}
.nav-badge.dim { background:var(--surface2); color:var(--text2); border:1px solid var(--border); animation:none; box-shadow:none; }
.rec-cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px; }
.rec-group h3 { font-size:14px; font-weight:700; margin:6px 0 10px; }
.rec-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:13px; margin-bottom:9px; transition:all .15s; }
.rec-card:hover { border-color:var(--primary-bd); }
.rec-rank { color:var(--text3); font-weight:600; font-size:11px; margin-right:5px; }
.rec-topic { font-size:14px; font-weight:700; margin-bottom:4px; color:var(--text); }
.rec-date { font-size:11px; color:var(--hot); font-weight:600; margin-bottom:3px; }
.rec-why { font-size:11px; color:var(--text2); margin-bottom:6px; }
.rec-ref { font-size:11px; display:inline-block; }
.rec-empty { color:var(--text2); padding:16px; font-size:12px; }
.hot-flag { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:8px; background:var(--danger-bg); color:var(--danger); white-space:nowrap; border:1px solid var(--danger-bd); }
.reedit-box { background:var(--danger-bg); border:1px solid var(--danger-bd); border-radius:12px; padding:13px 16px; margin:10px 0 18px; }
.reedit-head { font-size:15px; font-weight:700; color:var(--text); }
.reedit-sub { display:block; font-size:11px; font-weight:500; color:var(--text2); margin-top:3px; }
.reedit-card { padding:9px 0; border-top:1px solid rgba(239,68,68,.18); }
.reedit-card:first-of-type { border-top:none; }
.reedit-line1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.reedit-line1 .row-title { max-width:420px; font-weight:600; }
.reedit-meta { font-size:11px; color:var(--text2); margin-top:3px; padding-left:24px; }
@media (max-width:600px){ .rec-cols{ grid-template-columns:1fr; } .reedit-line1 .row-title{ max-width:200px; } header { flex-direction:column; align-items:flex-start; } header .header-chips { margin-left:0; } }
footer { text-align:center; color:var(--text3); font-size:11px; padding:24px 0 8px; }

.tbl-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:auto; margin:10px 0 16px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { text-align:left; font-weight:700; font-size:11px; color:var(--text2);
  padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface2); text-transform:uppercase; letter-spacing:.3px; }
tbody td { padding:11px 14px; border-bottom:1px solid var(--divider); vertical-align:middle; color:var(--text); }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--hover); }
td.rank, th.rank { width:34px; text-align:center; color:var(--text2); font-weight:700; font-variant-numeric:tabular-nums; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
td.num.lead { color:var(--text); font-weight:700; }
.muted { color:var(--text2); }
.cat-badge { display:inline-block; font-size:10px; padding:2px 9px; border-radius:10px; font-weight:700; white-space:nowrap; background:var(--primary-bg); color:var(--primary-hi); border:1px solid var(--primary-bd); }
.kw { font-weight:700; font-size:14px; }
.cellv { display:flex; flex-direction:column; gap:1px; }
.row-title { display:inline-block; max-width:520px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; color:var(--text); font-weight:500; }
.row-sub { font-size:11px; color:var(--text2); }
.ch-tag { font-size:10px; padding:1px 7px; border-radius:8px; background:var(--bg); color:var(--text2); border:1px solid var(--border); font-weight:600; }
.vid-list { display:flex; flex-direction:column; gap:6px; }
.vd-row { display:flex; flex-direction:column; gap:1px; max-width:560px; }
.vd-title { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.vd-meta { font-size:11px; color:var(--text2); }
.vd-date { color:var(--hot); font-weight:600; }
.rep-sec { margin:24px 0 6px; display:flex; align-items:baseline; gap:8px; }
.rep-sec h2 { font-size:17px; font-weight:800; color:var(--text); letter-spacing:-0.3px; }
.rep-sec .cnt { font-size:12px; color:var(--text2); font-weight:500; }
.rep-note { font-size:12px; color:var(--text2); margin:0 0 6px; }
section table { margin:10px 0; }

.news-list { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.news-row { display:flex; gap:12px; align-items:baseline; padding:13px 16px; border-bottom:1px solid var(--divider); }
.news-row:last-child { border-bottom:none; }
.news-row:hover { background:var(--hover); }
.news-rank { width:22px; flex-shrink:0; color:var(--text2); font-size:13px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.news-body { display:flex; flex-direction:column; gap:3px; min-width:0; }
.news-title { font-size:13px; font-weight:600; color:var(--text); white-space:normal; }
.news-title:hover { color:var(--primary-hi); }
.news-meta { font-size:11px; color:var(--text2); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.news-src { color:var(--hot); font-weight:700; }
.news-cat { font-size:10px; padding:1px 7px; border-radius:8px; background:var(--primary-bg); color:var(--primary-hi); font-weight:700; border:1px solid var(--primary-bd); }
.news-orig { font-size:11px; color:var(--text2); }
.date-nav { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 14px; align-items:center; font-size:12px; }
.date-nav .lbl { color:var(--text2); margin-right:4px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; font-size:11px; }
.date-nav a { padding:4px 10px; border-radius:13px; background:var(--surface); color:var(--text2); font-weight:600; border:1px solid var(--border); transition:all .15s; }
.date-nav a:hover { border-color:var(--primary-bd); color:var(--text); }
.date-nav a.on { background:var(--primary); color:#fff; border-color:var(--primary); }

.subtab-nav { display:flex; gap:6px; margin:6px 0 14px; }
.subtab { padding:7px 14px; border-radius:18px; background:var(--surface); color:var(--text2); font-size:13px; font-weight:600; border:1px solid var(--border); cursor:pointer; }
.subtab:hover { border-color:var(--primary-bd); color:var(--text); }
.subtab.on { background:var(--primary); color:#fff; border-color:var(--primary); }
.subtab.dim { opacity:.45; cursor:not-allowed; }
.chan-chip { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; background:var(--primary-bg); color:var(--primary-hi); font-weight:700; margin:3px 4px 0 0; border:1px solid var(--primary-bd); }

/* Manual (사용 가이드) — 시각 컴포넌트 */
.manual-body { font-size:14px; line-height:1.75; color:var(--text); padding:8px 4px; max-width:920px; }

/* 단계 카드 (1→2→3 가로 흐름) */
.steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin:14px 0; }
.step { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; position:relative; }
.step .step-num { position:absolute; top:-10px; left:14px; background:var(--primary); color:#fff; font-weight:800; font-size:12px; padding:3px 10px; border-radius:10px; }
.step .step-title { font-weight:700; color:var(--text); font-size:14px; margin:6px 0 6px; }
.step .step-body { font-size:12px; color:var(--text2); line-height:1.6; }
.step.hot { border-color:var(--hot-bd); background:var(--hot-bg); }
.step.hot .step-num { background:var(--hot); color:#000; }
.step.warn { border-color:var(--warn-bd); background:var(--warn-bg); }
.step.warn .step-num { background:var(--warn); color:#000; }

/* 사이트 UI 미니어처 — 실제 페이지처럼 */
.mock { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; margin:14px 0; }
.mock-header { display:flex; align-items:baseline; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--divider); margin-bottom:10px; }
.mock-brand { font-size:14px; font-weight:800; color:var(--primary); }
.mock-slogan { font-size:10px; color:var(--text2); }
.mock-chips { margin-left:auto; display:flex; gap:5px; }
.mock-chip { font-size:10px; padding:3px 8px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-weight:600; }
.mock-chip.warn { color:var(--warn); border-color:var(--warn-bd); background:var(--warn-bg); }
.mock-chip.hot { color:var(--hot); border-color:var(--hot-bd); background:var(--hot-bg); }
.mock-chip b { color:var(--text); }
.mock-chip.warn b { color:var(--warn); }
.mock-chip.hot b { color:var(--hot); }
.mock-tabs { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 10px; }
.mock-tab { font-size:11px; padding:5px 10px; border-radius:13px; background:var(--surface); color:var(--text2); border:1px solid var(--border); font-weight:600; }
.mock-tab.on { background:var(--primary); color:#fff; border-color:var(--primary); }
.mock-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin:6px 0; position:relative; }
.mock-card.crown { border-color:rgba(255,193,7,.55); background:linear-gradient(180deg, rgba(255,193,7,.06) 0%, var(--surface) 60%); }
.mock-rank-badge { display:inline-block; background:linear-gradient(135deg,#ffd700,#ffb300); color:#000; font-size:11px; font-weight:800; padding:2px 8px; border-radius:8px; margin-right:6px; }
.mock-ch-name { font-size:13px; font-weight:700; color:var(--text); display:inline; }
.mock-delta { color:var(--up); font-weight:700; font-size:11px; margin-left:6px; }
.mock-meta-line { font-size:11px; color:var(--text2); margin-top:3px; }
.mock-stats-row { display:flex; gap:14px; margin:7px 0; padding:6px 0; border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); }
.mock-stat { font-size:10px; color:var(--text2); }
.mock-stat b { display:block; font-size:13px; font-weight:800; color:var(--text); }
.mock-stat.sig b { color:var(--danger); }
.mock-stat.hot b { color:var(--hot); }
.mock-vid-dual { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--divider); }
.mock-vid-mini { font-size:10px; }
.mock-vid-mini .lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.mock-vid-mini .lbl.pop { color:var(--warn); }
.mock-vid-mini .lbl.latest { color:var(--hot); }
.mock-vid-thumb { background:linear-gradient(135deg, #3a3a4a, #1a1a26); height:55px; border-radius:5px; margin:3px 0; display:flex; align-items:center; justify-content:center; color:var(--text3); font-size:9px; }
.mock-vid-mini .title { font-size:11px; color:var(--text); line-height:1.3; }
.mock-pointer { display:inline-block; background:var(--primary); color:#fff; font-size:10px; font-weight:700; padding:3px 9px; border-radius:5px; position:absolute; }
.mock-pointer::before { content:"👉 "; }

/* 인포그래픽 게이지 */
.gauge { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin:14px 0; }
.gauge-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; }
.gauge-bar { height:24px; border-radius:8px; background:linear-gradient(90deg, #4ade80 0%, #4ade80 30%, #facc15 30%, #facc15 60%, #ff7a45 60%, #ff7a45 80%, #ef4444 80%); position:relative; overflow:hidden; }
.gauge-labels { display:flex; justify-content:space-between; margin-top:4px; font-size:10px; color:var(--text2); }
.gauge-pointer { position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--text); border-radius:2px; box-shadow:0 0 0 2px var(--surface); }

/* 메트릭 인포그래픽 카드 */
.metric-card { display:flex; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin:10px 0; }
.metric-icon { font-size:26px; flex-shrink:0; }
.metric-body { flex:1; min-width:0; }
.metric-body .name { font-size:14px; font-weight:800; color:var(--text); }
.metric-body .formula { font-size:11px; color:var(--text2); margin:3px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.metric-body .meaning { font-size:12px; color:var(--text); margin-top:5px; }
.metric-grades { display:flex; gap:6px; margin-top:8px; }
.metric-grades .grade { font-size:10px; padding:3px 8px; border-radius:6px; font-weight:700; }
.metric-grades .grade.good { background:rgba(74,222,128,.15); color:var(--up); border:1px solid rgba(74,222,128,.4); }
.metric-grades .grade.mid { background:rgba(250,204,21,.15); color:#facc15; border:1px solid rgba(250,204,21,.4); }
.metric-grades .grade.bad { background:rgba(239,68,68,.15); color:var(--danger); border:1px solid rgba(239,68,68,.4); }

/* 시간 룰러 (첫 사건 시점) */
.ruler { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin:14px 0; position:relative; }
.ruler-track { height:50px; background:linear-gradient(90deg, var(--hot) 0%, var(--hot) 33%, var(--warn) 33%, var(--warn) 66%, var(--danger) 66%); border-radius:8px; position:relative; }
.ruler-marker { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); box-shadow:0 0 0 2px var(--surface); }
.ruler-marker::after { content:attr(data-label); position:absolute; top:-22px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap; }
.ruler-scale { display:flex; justify-content:space-between; margin-top:6px; font-size:10px; color:var(--text2); }
.ruler-labels { display:flex; justify-content:space-between; margin-top:3px; font-size:9px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }

/* 흐름 다이어그램 (큰 화살표 박스) */
.flow { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; align-items:stretch; margin:14px 0; }
.flow-node { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; position:relative; }
.flow-node .icon { font-size:24px; display:block; margin-bottom:5px; }
.flow-node .title { font-size:12px; font-weight:700; color:var(--text); }
.flow-node .sub { font-size:10px; color:var(--text2); margin-top:3px; }
.flow-node.primary { background:var(--primary-bg); border-color:var(--primary-bd); }
.flow-node.primary .title { color:var(--primary-hi); }

/* 좋은 예 vs 나쁜 예 박스 */
.compare { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
.compare-box { padding:14px; border-radius:10px; border:1px solid; }
.compare-box.good { background:rgba(74,222,128,.07); border-color:rgba(74,222,128,.35); }
.compare-box.bad { background:rgba(239,68,68,.07); border-color:rgba(239,68,68,.35); }
.compare-box .head { font-size:13px; font-weight:800; margin-bottom:6px; }
.compare-box.good .head { color:var(--up); }
.compare-box.bad .head { color:var(--danger); }
.compare-box ul { margin:5px 0 0 18px; }
.compare-box li { font-size:12px; line-height:1.55; margin:3px 0; }

/* TL;DR callout */
.tldr { background:linear-gradient(135deg, var(--primary-bg), var(--info-bg)); border:1px solid var(--primary-bd); border-radius:10px; padding:14px 16px; margin:14px 0; }
.tldr-title { font-size:13px; font-weight:800; color:var(--primary-hi); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.tldr-body { font-size:13px; color:var(--text); line-height:1.65; }

/* 클코 자동화 가이드 (접이식 details) */
details.auto-guide { background:linear-gradient(135deg, var(--primary-bg), rgba(132,204,22,.04)); border:2px solid var(--primary-bd); border-radius:14px; padding:0; margin:18px 0; overflow:hidden; }
details.auto-guide > summary { cursor:pointer; list-style:none; padding:18px 22px; font-size:16px; font-weight:800; color:var(--primary-hi); display:flex; align-items:center; gap:10px; user-select:none; transition:background .15s; }
details.auto-guide > summary::-webkit-details-marker { display:none; }
details.auto-guide > summary:hover { background:rgba(168,85,247,.08); }
details.auto-guide > summary::after { content:"▼ 펼쳐서 보기"; margin-left:auto; font-size:11px; font-weight:600; color:var(--text2); padding:5px 11px; background:var(--surface); border:1px solid var(--border); border-radius:14px; }
details.auto-guide[open] > summary::after { content:"▲ 접기"; }
details.auto-guide .auto-body { padding:6px 22px 24px; border-top:1px solid var(--primary-bd); }
details.auto-guide h3 { margin-top:22px; font-size:16px; color:var(--text); }
details.auto-guide h4 { margin-top:14px; font-size:14px; color:var(--primary-hi); }

/* 액션 흐름 — 사용자 vs Claude 구분 */
.action-flow { display:flex; flex-direction:column; gap:10px; margin:14px 0; }
.action-row { display:flex; align-items:flex-start; gap:12px; }
.action-actor { flex-shrink:0; width:80px; padding:8px 10px; border-radius:10px; text-align:center; font-size:11px; font-weight:700; }
.action-actor.user { background:rgba(255,122,69,.15); color:var(--warn); border:1px solid var(--warn-bd); }
.action-actor.claude { background:var(--primary-bg); color:var(--primary-hi); border:1px solid var(--primary-bd); }
.action-actor.system { background:rgba(96,165,250,.13); color:#60a5fa; border:1px solid rgba(96,165,250,.4); }
.action-actor .who { display:block; font-size:9px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px; }
.action-arrow { flex-shrink:0; color:var(--text3); font-size:18px; align-self:center; }
.action-body { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; font-size:13px; color:var(--text); line-height:1.55; }
.action-body code { background:var(--surface2); color:var(--primary-hi); padding:1px 5px; border-radius:4px; font-size:11.5px; }
.action-body .step-name { font-weight:700; color:var(--text); display:block; margin-bottom:3px; font-size:12px; }
.action-body ul { margin:4px 0 0 16px; }
.action-body li { font-size:12px; color:var(--text2); margin:2px 0; }

/* 명령어 예시 카드 */
.cmd-card { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin:6px 0; }
.cmd-card .cmd-input { flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; color:var(--primary-hi); background:var(--surface2); padding:6px 10px; border-radius:6px; }
.cmd-card .cmd-arrow { color:var(--text3); font-size:16px; }
.cmd-card .cmd-result { flex:1; font-size:12px; color:var(--text2); }

/* 강조 인용 박스 (인사이트 예시) */
.insight { background:var(--surface); border-left:4px solid var(--hot); border-radius:0 10px 10px 0; padding:13px 16px; margin:14px 0; }
.insight-tag { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--hot); margin-bottom:5px; }
.insight-section { margin:6px 0; font-size:12.5px; line-height:1.6; }
.insight-section b { color:var(--hot); }

.manual-body { font-size:14px; line-height:1.75; color:var(--text); padding:8px 4px; max-width:920px; }
.manual-body h1 { font-size:28px; font-weight:800; margin:24px 0 12px; color:var(--text); letter-spacing:-0.5px; }
.manual-body h2 { font-size:22px; font-weight:800; margin:32px 0 12px; padding-top:16px; border-top:1px solid var(--divider); color:var(--primary-hi); letter-spacing:-0.3px; }
.manual-body h3 { font-size:17px; font-weight:700; margin:20px 0 8px; color:var(--text); }
.manual-body h4 { font-size:15px; font-weight:700; margin:14px 0 6px; color:var(--text2); }
.manual-body p { margin:10px 0; }
.manual-body ul, .manual-body ol { margin:10px 0 14px 22px; }
.manual-body li { margin:5px 0; }
.manual-body strong, .manual-body b { color:var(--text); font-weight:700; }
.manual-body code { background:var(--surface2); color:var(--primary-hi); padding:1px 6px; border-radius:5px; font-size:0.92em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; border:1px solid var(--border); }
.manual-body pre { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; overflow-x:auto; margin:14px 0; line-height:1.55; font-size:12.5px; }
.manual-body pre code { background:none; border:none; padding:0; color:var(--text); }
.manual-body blockquote { border-left:3px solid var(--primary); background:var(--primary-bg); padding:10px 14px; margin:14px 0; border-radius:0 8px 8px 0; color:var(--text); font-size:13px; }
.manual-body table { width:100%; border-collapse:collapse; margin:14px 0; font-size:13px; background:var(--surface); border-radius:8px; overflow:hidden; }
.manual-body th { background:var(--surface2); color:var(--text); font-weight:700; padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); }
.manual-body td { padding:8px 12px; border-bottom:1px solid var(--divider); }
.manual-body td:first-child { color:var(--text); font-weight:600; }
.manual-body hr { border:none; border-top:1px solid var(--divider); margin:24px 0; }
.manual-body a { color:var(--primary-hi); }
.manual-body a:hover { color:var(--primary); }
/* 부드러운 스크롤 + h2 anchor 위치 보정 */
html { scroll-behavior:smooth; }
.manual-body h2 { scroll-margin-top:20px; }
/* TOC 박스 (카테고리 그룹 2단) */
.manual-toc { background:linear-gradient(135deg,rgba(168,85,247,.10) 0%,rgba(99,102,241,.08) 100%); border:1.5px solid rgba(168,85,247,.45); border-radius:12px; padding:14px 18px; margin:8px 0 28px; position:sticky; top:8px; z-index:5; backdrop-filter:blur(8px); max-height:calc(100vh - 24px); overflow-y:auto; }
.manual-toc::-webkit-scrollbar { width:6px; }
.manual-toc::-webkit-scrollbar-thumb { background:rgba(168,85,247,.4); border-radius:3px; }
.manual-toc summary { font-size:14px; color:var(--text); cursor:pointer; padding:6px 0; user-select:none; list-style:none; outline:none; }
.manual-toc summary::-webkit-details-marker { display:none; }
.manual-toc summary::before { content:"▼ "; color:#c084fc; font-size:11px; margin-right:6px; transition:transform .2s; display:inline-block; }
.manual-toc details:not([open]) summary::before { transform:rotate(-90deg); }
.manual-toc summary b { color:#c084fc; font-weight:800; font-size:15px; }
.manual-toc .toc-count { color:var(--text2); font-size:11px; font-weight:600; margin-left:6px; background:rgba(168,85,247,.15); padding:2px 8px; border-radius:10px; }
.manual-toc .toc-hint { color:var(--text3); font-size:11px; font-weight:400; margin-left:8px; font-style:italic; }
/* 카테고리 그룹 2단 grid */
.manual-toc .toc-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 18px; margin-top:14px; padding-top:12px; border-top:1px dashed rgba(168,85,247,.3); }
.manual-toc .toc-group { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.manual-toc .toc-cat { font-size:13px; font-weight:800; color:#c084fc; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(168,85,247,.2); display:flex; align-items:center; gap:6px; }
.manual-toc .toc-cat-emoji { font-size:15px; }
.manual-toc .toc-cat-count { color:var(--text3); font-size:10.5px; font-weight:600; margin-left:auto; background:rgba(168,85,247,.1); padding:1px 6px; border-radius:8px; }
.manual-toc ul { list-style:none; margin:0; padding:0; }
.manual-toc li { margin:0; padding:0; }
.manual-toc li a { display:flex; align-items:center; gap:8px; padding:5px 8px; font-size:12.5px; color:var(--text); text-decoration:none; border-radius:5px; transition:all .12s; line-height:1.4; }
.manual-toc li a:hover { background:rgba(168,85,247,.12); color:var(--text); text-decoration:none; padding-left:11px; }
.manual-toc .toc-num { font-size:10px; font-weight:800; color:#c084fc; background:rgba(168,85,247,.15); padding:2px 5px; border-radius:3px; flex-shrink:0; min-width:20px; text-align:center; letter-spacing:.3px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
@media (max-width:700px) { .manual-toc { position:static; padding:10px 12px; } .manual-toc .toc-groups { grid-template-columns:1fr; } }

/* Autopsy 페이지 폼 */
.autopsy-form { background:var(--surface); border:2px solid var(--primary-bd); border-radius:12px; padding:18px; margin:6px 0 20px; }
.autopsy-form .ah { font-size:15px; font-weight:800; color:var(--text); margin-bottom:4px; }
.autopsy-form .asub { font-size:12px; color:var(--text2); margin-bottom:14px; }
.autopsy-form textarea { width:100%; min-height:110px; padding:11px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; }
.autopsy-form textarea:focus { outline:none; border-color:var(--primary); }
.autopsy-form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.autopsy-form input[type=text] { padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; }
.autopsy-form input[type=text]:focus { outline:none; border-color:var(--primary); }
.autopsy-form .actions { display:flex; gap:8px; margin-top:14px; align-items:center; }
.autopsy-form button { padding:10px 22px; background:linear-gradient(135deg,var(--primary) 0%, var(--primary-hi) 100%); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 0 16px rgba(168,85,247,.3); transition:all .15s; }
.autopsy-form button:hover { box-shadow:0 0 22px rgba(168,85,247,.5); transform:translateY(-1px); }
.autopsy-form button.ghost { background:var(--surface2); color:var(--text2); box-shadow:none; }
.autopsy-form button.ghost:hover { color:var(--text); }
.autopsy-form .hint { font-size:11px; color:var(--text3); margin-left:auto; }
.autopsy-card { display:flex; flex-direction:column; min-height:130px; transition:all .18s; }
.autopsy-card:hover { border-color:var(--primary) !important; box-shadow:0 4px 16px rgba(168,85,247,.18); }

@media (max-width:600px) {
  body { padding:14px; }
  header h1 { font-size:20px; }
  .cards { grid-template-columns:repeat(2,1fr); gap:8px; }
  .card .value { font-size:22px; }

  .filters { flex-direction:column; align-items:stretch; }
  .row-title { max-width:200px; }
  tbody td, thead th { padding:9px 8px; }
  .ch-vid-dual { grid-template-columns:1fr; }
  .autopsy-form .row2 { grid-template-columns:1fr; }
}
